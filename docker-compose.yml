services:
  db:
    image: postgres:16
    container_name: paperless-db
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    ports:
      - "5432:5432"
    volumes:
      - paperless-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: paperless-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: paperless
      RABBITMQ_DEFAULT_PASS: paperless
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  paperless-rest:
    build:
      context: ./paperless-rest
    container_name: paperless-rest
    environment:
      DB_URL: jdbc:postgresql://db:5432/paperless
      DB_USER: paperless
      DB_PASSWORD: paperless
      JWT_SECRET: ${JWT_SECRET:-change-me-local-docker-secret-0123456789}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: paperless
      RABBITMQ_PASSWORD: paperless
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  paperless-worker:
    build:
      context: ./paperless-worker
    container_name: paperless-worker
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: paperless
      RABBITMQ_PASSWORD: paperless
    depends_on:
      rabbitmq:
        condition: service_healthy

  paperless-webui:
    build:
      context: ./paperless-webui
    container_name: paperless-webui
    ports:
      - "80:80"
    depends_on:
      - paperless-rest

volumes:
  paperless-db-data:
