server:
  port: 8080

spring:
  application:
    name: paperless-rest
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paperless}
    username: ${DB_USER:paperless}
    password: ${DB_PASSWORD:paperless}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:paperless}
    password: ${RABBITMQ_PASSWORD:paperless}
    connection-timeout: 5s
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3

paperless:
  queues:
    ocr: ocr.queue
    ocr-result: ocr.result.queue
  ocr:
    retry-after: ${OCR_RETRY_AFTER:PT2M}
    retry-interval: ${OCR_RETRY_INTERVAL:PT1M}

security:
  jwt:
    # set JWT_SECRET in production; the default is only for local development
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    validity: ${JWT_VALIDITY:PT24H}

logging:
  level:
    at.fhtw.swen3.paperless: INFO
