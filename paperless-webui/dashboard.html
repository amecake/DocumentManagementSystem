<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DMS-Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
    <div class="page-head">
        <h1>DMS-Dashboard</h1>
        <button id="logoutBtn" class="btn btn-outline btn-small">Logout</button>
    </div>

    <section>
        <h2>Upload document</h2>
        <form id="uploadForm">
            <input type="file" id="fileInput" accept="application/pdf" required>
            <input type="text" id="titleInput" placeholder="Title (optional)" maxlength="255">
            <button type="submit" id="uploadBtn" class="btn">Upload</button>
        </form>
        <p class="hint">PDF only, max. 20 MB</p>
    </section>

    <section class="section">
        <h2>Documents</h2>
        <input type="text" id="tagFilter" placeholder="Filter by tag..." style="max-width:320px;margin-bottom:1rem">

        <div id="loader" class="loader"></div>

        <div class="table-wrap">
            <table id="docTable" hidden>
                <thead>
                <tr><th>Title</th><th>Filename</th><th>Tags</th><th>Uploaded</th><th>Status</th><th></th></tr>
                </thead>
                <tbody id="docTableBody"></tbody>
            </table>
        </div>
        <p id="emptyState" class="empty" hidden>No documents found.</p>
    </section>
</main>

<script src="api.js"></script>
<script>
    if (!isLoggedIn()) window.location.href = "index.html";

    document.getElementById("logoutBtn").addEventListener("click", () => {
      clearToken();
      window.location.href = "index.html";
    });

    let allDocs = [];
    let docTags = {};

    async function loadDocuments() {
      const res = await apiFetch("/documents");
      allDocs = res.status === 204 ? [] : await res.json();

      for (const doc of allDocs) {
        const tagsRes = await apiFetch(`/documents/${doc.id}/tags`);
        docTags[doc.id] = tagsRes.status === 204 ? [] : await tagsRes.json();
      }

      document.getElementById("loader").hidden = true;
      renderDocuments(allDocs);

      // reload while the worker is still processing something
      if (allDocs.some(doc => doc.status === "QUEUED")) {
        setTimeout(loadDocuments, 3000);
      }
    }

    function renderDocuments(docs) {
      const tbody = document.getElementById("docTableBody");
      tbody.innerHTML = "";
      document.getElementById("emptyState").hidden = docs.length > 0;
      document.getElementById("docTable").hidden = docs.length === 0;

      docs.forEach(doc => {
        const tags = docTags[doc.id] || [];
        const tr = document.createElement("tr");

        // textContent so titles/filenames are never interpreted as HTML
        [doc.title, doc.originalFilename].forEach(text => {
          const td = document.createElement("td");
          td.textContent = text;
          tr.appendChild(td);
        });

        const tagTd = document.createElement("td");
        tags.forEach(t => {
          const chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = t;
          tagTd.appendChild(chip);
        });
        tr.appendChild(tagTd);

        const dateTd = document.createElement("td");
        dateTd.textContent = new Date(doc.uploadedAt).toLocaleString();
        tr.appendChild(dateTd);

        const statusTd = document.createElement("td");
        const badge = document.createElement("span");
        const status = doc.status || "-";
        badge.className = "badge badge-" + status.toLowerCase();
        badge.textContent = status;
        statusTd.appendChild(badge);
        tr.appendChild(statusTd);

        const linkTd = document.createElement("td");
        const link = document.createElement("a");
        link.href = `detail.html?id=${encodeURIComponent(doc.id)}`;
        link.className = "btn btn-outline btn-small";
        link.textContent = "View";
        linkTd.appendChild(link);
        tr.appendChild(linkTd);

        tbody.appendChild(tr);
      });
    }

    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("uploadBtn");
      const file = document.getElementById("fileInput").files[0];
      const title = document.getElementById("titleInput").value.trim();

      if (!file) {
        alert("Please choose a file");
        return;
      }
      if (file.type !== "application/pdf" && !file.name.toLowerCase().endsWith(".pdf")) {
        alert("Only PDF files are allowed");
        return;
      }
      if (file.size > 20 * 1024 * 1024) {
        alert("File must be smaller than 20 MB");
        return;
      }
      if (title.length > 255) {
        alert("Title must be at most 255 characters");
        return;
      }

      const formData = new FormData();
      formData.append("file", file);
      if (title) formData.append("title", title);

      setLoading(btn, true);
      try {
        const res = await apiFetch("/documents", {
          method: "POST",
          body: formData
        });

        if (res.ok) {
          document.getElementById("uploadForm").reset();
          await loadDocuments();
        } else {
          alert("Upload failed");
        }
      } catch (err) {
        alert("Upload failed");
      }
      setLoading(btn, false);
    });

    document.getElementById("tagFilter").addEventListener("input", (e) => {
      const tag = e.target.value.trim().toLowerCase();
      if (!tag) {
        renderDocuments(allDocs);
        return;
      }
      const filtered = allDocs.filter(doc => {
        const tags = docTags[doc.id] || [];
        return tags.some(t => t.toLowerCase().includes(tag));
      });
      renderDocuments(filtered);
    });

    loadDocuments();
</script>
</body>
</html>
