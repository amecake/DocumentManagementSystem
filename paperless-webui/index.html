<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Paperless</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Paperless</h1>

    <h2>Login</h2>
    <form id="loginForm">
        <input type="text" id="loginUsername" placeholder="Username" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <h2>Register</h2>
    <form id="registerForm">
        <input type="text" id="regUsername" placeholder="Username" required>
        <input type="email" id="regEmail" placeholder="Email" required>
        <input type="password" id="regPassword" placeholder="Password" required>
        <button type="submit">Register</button>
    </form>

    <p id="message"></p>
</div>

<script src="api.js"></script>
<script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("loginUsername").value;
      const password = document.getElementById("loginPassword").value;

      const res = await fetch(API_BASE + "/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      if (res.ok) {
        const data = await res.json();
        setToken(data.accessToken);
        window.location.href = "dashboard.html";
      } else {
        document.getElementById("message").textContent = "Login failed";
      }
    });

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("regUsername").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;

      if (username.length < 3) {
        document.getElementById("message").textContent = "Username must be at least 3 characters";
        return;
      }
      if (password.length < 8) {
        document.getElementById("message").textContent = "Password must be at least 8 characters";
        return;
      }
      if (!email.includes("@")) {
        document.getElementById("message").textContent = "Invalid email";
        return;
      }

      const res = await fetch(API_BASE + "/auth/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, email, password })
      });

      if (res.ok) {
        document.getElementById("message").textContent = "Registered! Now log in.";
      } else {
        document.getElementById("message").textContent = "Registration failed";
      }
    });
</script>
</body>
</html>
