<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Document Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="center">
<main class="card narrow">
    <h1>Document-Management-System</h1>

    <form id="loginForm">
        <input type="text" id="loginUsername" placeholder="Username" autocomplete="username" required>
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
        <button type="submit" id="loginBtn" class="btn">Login</button>
    </form>

    <p id="message" class="message"></p>

    <div class="switch">
        <span>No account yet?</span>
        <a href="register.html" class="btn btn-outline btn-small">Register</a>
    </div>
</main>

<script src="api.js"></script>
<script>
    if (isLoggedIn()) window.location.href = "dashboard.html";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      const msg = document.getElementById("message");
      const username = document.getElementById("loginUsername").value;
      const password = document.getElementById("loginPassword").value;

      msg.textContent = "";
      setLoading(btn, true);
      try {
        const res = await fetch(API_BASE + "/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          const data = await res.json();
          setToken(data.accessToken);
          window.location.href = "dashboard.html";
          return;
        }
        msg.textContent = "Login failed";
      } catch (err) {
        msg.textContent = "Server not reachable";
      }
      setLoading(btn, false);
    });
</script>
</body>
</html>
