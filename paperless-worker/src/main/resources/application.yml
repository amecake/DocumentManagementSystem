spring:
  application:
    name: paperless-worker
  main:
    web-application-type: none
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:paperless}
    password: ${RABBITMQ_PASSWORD:paperless}
    listener:
      simple:
        default-requeue-rejected: false

logging:
  level:
    at.fhtw.swen3.paperless: INFO
